<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi amor</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="icon" href="image.ico">

</head>
<body>
      <!-- Filtro oscuro para el fondo -->
    <div class="overlay"></div>

    <!-- AQUÍ AGREGAS TU CANCIÓN -->
    <audio id="musica" src="Diego Luna - Te Amo Y Más (Letra).mp3"></audio>
    <!-- El contenedor que escuchará el clic -->

    <!-- =========================================
    NUEVO: LAS 4 FOTOS DE LAS ESQUINAS
    ========================================= -->
  
  <!-- Esquina Superior Izquierda -->
  <div class="corner-photo top-left">
    <img src="foto1.jpeg" alt="Foto 1">
    <span class="phrase">Nuestra escapada😚❤️‍🔥</span>
  </div>

  <!-- Esquina Superior Derecha -->
  <div class="corner-photo top-right">
    <img src="foto2.jpeg" alt="Foto 2">
    <span class="phrase">Mi cumple🥹❤️</span>
  </div>

  <!-- Esquina Inferior Izquierda -->
  <div class="corner-photo bottom-left">
    <img src="foto3.jpg" alt="Foto 3">
    <span class="phrase">40-20😊</span>
  </div>

  <!-- Esquina Inferior Derecha -->
  <div class="corner-photo bottom-right">
    <img src="foto4.jpeg" alt="Foto 4">
    <span class="phrase">Te amo💗</span>
  </div>

    <!-- Medio Derecha -->
  <div class="corner-photo middle-right">
    <img src="foto5.jpg" alt="Foto 5">
    <span class="phrase">Entre mañoserias🙈❤️‍🔥</span>
  </div>

      <!-- Medio Izquierda -->
  <div class="corner-photo middle-left">
    <img src="foto6.jpg" alt="Foto 6">
    <span class="phrase">Bonitos recuerdos🤪🥰</span>
  </div>

  <!-- ========================================= -->

<div class="envelope-wrapper" id="envelope">
    <div class="envelope">
    <div class="flap"></div>
    
    <div class="letter">
        <h2>Hola, pequeña</h2>
        <p>Te amo mucho, así que decidí hacer esto de la manera más única y especial solo para ti.</p>
        <p>Eres lo más importante en mi vida.</p>
    </div>
    
    <div class="hearts">
        <div class="heart">❤️</div>
        <div class="heart">💖</div>
        <div class="heart">💕</div>
    </div>
    </div>
</div>

<p class="instruction">(Toca el sobre para abrirlo)</p>

<script>
const envelope = document.getElementById('envelope');
    const musica = document.getElementById('musica');
    
    envelope.addEventListener('click', () => {
      // Abre el sobre
    envelope.classList.toggle('open');
    
      // Reproduce la música si el sobre se abre. 
      // Los navegadores requieren que el usuario interactúe (haga clic) antes de que el audio pueda sonar, así que este es el momento ideal.
    if(envelope.classList.contains('open')) {
        musica.play();
    } else {
        // Opcional: pausar si lo vuelve a cerrar
        musica.pause(); 
    }
    });
</script>
</body>
</html>
